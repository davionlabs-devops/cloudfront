name: Sync to davionlabs mirror

# 同步本仓库内容到 davionlabs-devops/cloudfront（镜像站，绑定 davionlabs.sxxw.site）。
# CNAME 是两边唯一的差异，同步时会重写成镜像域名。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror with rewritten CNAME
        env:
          DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "davionlabs.sxxw.site" > CNAME
          git add CNAME
          git commit -m "chore: 镜像站点绑定 davionlabs.sxxw.site"
          git push --force git@github.com:davionlabs-devops/cloudfront.git HEAD:main
